{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Info Pathway Hub - MyLuanier</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pathway.css' %}" />
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <div class="logo">
          <img src="{% static 'images/MyLuanierLogo.jpeg' %}" alt="MyLuanier" class="logo-img" />
        </div>
        <nav>
          <ul>
            <li><a href="{% url 'homepage' %}">Home</a></li>
            <li><a href="{% url 'about_us' %}">About Us</a></li>
            <div class="dropdown">
              <p><a href="#">Services ▾</a></p>
              <div class="dropdown-content">
                <a href="{% url 'merit_calculator' %}">Merit Calculator</a>
                <a href="{% url 'pathway_advisor' %}">Pathway Advisor</a>
                <a href="{% url 'scholarship_information' %}">Scholarship </a>
              </div>
            </div>
            <li><a href="{% url 'contact' %}">Contact</a></li>
          </ul>
        </nav>
        <div class="nav-tagline">NAVIGATE<br />YOUR FUTURE</div>
      </div>
    </header>

    <section class="info-hero">
      <div class="container">
        <h1>INFO PATHWAY HUB</h1>
        <p>
          Comprehensive guide to every academic pathway and program available
          after SPM.
        </p>
      </div>
    </section>

    <main class="info-container">
      <div class="container">
        <div class="university-grid">
          <div class="uni-card">
            <img src="{% static 'images/upsi_logo.png' %}" alt="UPSI" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/uniza_logo.png' %}" alt="UNISZA" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/utem_logo.png' %}" alt="UTEM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/uitm_logo.png' %}" alt="UITM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/umt_logo.png' %}" alt="UMT" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/ums_logo.png' %}" alt="UMS" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/umpsa_logo.png' %}" alt="UMPSA" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/uthm_logo.png' %}" alt="UTHM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/ukm_logo.png' %}" alt="UKM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/umk_logo.png' %}" alt="UMK" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/um_logo.png' %}" alt="UM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/usim_logo.png' %}" alt="USIM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/upm_logo.png' %}" alt="UPM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/unimap_logo.png' %}" alt="UNIMAP" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/uum_logo.png' %}" alt="UUM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/uiam_logo.png' %}" alt="UIAM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/unimas_logo.png' %}" alt="UNIMAS" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/upnm_logo.png' %}" alt="UPNM" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/politeknik_logo.png' %}" alt="POLITEKNIK" />
          </div>

          <div class="uni-card">
            <img src="{% static 'images/kolejmara_logo.png' %}" alt="KOLEJ_MARA" />  
          </div>

          <div class="uni-card">
            <img src="{% static 'images/kpm_logo.png' %}" alt="KPM" />
          </div>

        </div>
      </div>
    </main>
    <div id="pathwayModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>

        <div class="modal-scroll-area">
          <div class="modal-header">
            <div class="modal-logo-container">
              <img src="" alt="Logo" id="modalLogo" />
            </div>
            <div class="course-label-badge">Course Offered</div>
          </div>

          <div class="course-horizontal-scroll" id="modalPathways"></div>
        </div>
      </div>
    </div>

    <script src="{% static 'js/pathwayScript.js' %}"></script>
  </body>
</html>
