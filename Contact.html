<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - MyLuanier</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>
    <script type="text/javascript">
      (function () {
        emailjs.init("bOKLkuGx2JuFJ1HJf"); // You get this from EmailJS Account settings
      })();
    </script>
  </head>
  <body>
    <header>
      <div class="container nav-container">
        <div class="logo">
          <a href="index.html">
            <img
              src="MyLuanierLogo.jpeg"
              alt="MyLuanier - Your Path to Success"
              class="logo-img"
            />
          </a>
        </div>
        <nav>
          <ul>
            <li><a href="homepages.html">Home</a></li>
            <li><a href="About_Us.html">About Us</a></li>
            <div class="dropdown">
              <p><a href="#">Services ▾</a></p>
              <div class="dropdown-content">
                <a href="Merit_Calculator.html">Merit Calculator</a>
                <a href="Pathway_Advisor.html">Pathway Advisor</a>
                <a href="Pathway_Hub.html">Info Hub </a>
                <a href="Scholarship_Information.html">Scholarship</a>
              </div>
            </div>
            <li><a href="#" class="active">Contact</a></li>
          </ul>
        </nav>
        <div class="nav-tagline">NAVIGATE<br />YOUR FUTURE</div>
      </div>
    </header>

    <main class="contact-page">
      <div class="container">
        <h1 class="page-title">Contact MyLuanier</h1>

        <div class="contact-card">
          <div class="contact-form-side">
            <h2>GET IN TOUCH</h2>
            <form id="contact-form">
              <div class="form-item">
                <label>Full Name:</label>
                <input
                  type="text"
                  id="user_name"
                  name="from_name"
                  placeholder="Sofea Albarakbah"
                  required
                />
              </div>
              <div class="form-item">
                <label>Email Address:</label>
                <input
                  type="email"
                  id="user_email"
                  name="user_email"
                  placeholder="Sofea.Albarakbah@gmail.com"
                  required
                />
              </div>
              <div class="form-item">
                <label>Subject:</label>
                <input
                  type="text"
                  id="subject"
                  name="subject"
                  placeholder="General Inquiry"
                  required
                />
              </div>
              <div class="form-item">
                <label>Message:</label>
                <textarea
                  id="message"
                  name="message"
                  rows="6"
                  placeholder="Enter your message here:"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn-send">SEND MESSAGE</button>
            </form>
          </div>

          <div class="contact-info-side">
            <div class="info-block">
              <h3>DIRECT COMMUNICATION</h3>
              <p class="email-link">
                <i class="fa-solid fa-envelope"></i>
                <strong>EMAIL :</strong><br />
                MyLuanier@gmail.com
              </p>
            </div>

            <div class="info-block">
              <h3>SOCIAL MEDIA:</h3>
              <ul class="social-list">
                <li><i class="fa-brands fa-linkedin"></i> @MyLuanier</li>
                <li><i class="fa-brands fa-facebook"></i> @MyLuanier</li>
                <li><i class="fa-brands fa-instagram"></i> @MyLuanier</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="contact.js"></script>
  </body>
</html>
